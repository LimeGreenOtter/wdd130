<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
              <td>Elder Bednar</td>
              <td>BYU-Idaho 25th Anniversary Devotional</td>
              <td>I-Center</td>
              <td>2026</td>
          </tr>
        </table>
        <form>
          <label for="speaker">Speaker name:</label>
          <input type="text" id="speaker" name="speaker" placeholder="ex: John Doe" required><br>
          <label for="title">Title name: </label>
          <input type="text" id="title" name="title" placeholder="ex: The Quest" required><br>
          <label for="location">Location name: </label>
          <input type="text" id="location" name="location" placeholder="ex: Park" required><br>
          <label for="year">Year: </label>
          <input type="text" id="year" name="year" placeholder="ex: 1977" required><br>
          
        </form>
      </div>
    </main>
  </div>
</body>
</html>
